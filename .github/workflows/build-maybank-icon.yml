name: Build Maybank Black Glass Icon
on:
  workflow_dispatch:
  push:
    paths:
      - 'maybank-liquid-glass/**'
      - '.github/workflows/build-maybank-icon.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install Pillow numpy
      - name: Build 1024 and 2048 PNG
        run: python maybank-liquid-glass/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: maybank-black-liquid-glass
          path: maybank-liquid-glass/output/maybank-black-liquid-glass-*.png
          if-no-files-found: error
