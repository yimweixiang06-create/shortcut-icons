name: Build Maybank Glass Icon
on:
  workflow_dispatch:
  push:
    paths:
      - 'maybank-liquid-glass/**'
      - '.github/workflows/build-maybank-icon.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow numpy
      - run: python maybank-liquid-glass/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: maybank-liquid-glass-icons
          path: maybank-liquid-glass/output/*.png
